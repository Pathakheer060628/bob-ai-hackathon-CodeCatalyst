[project]
name = "gridsentinel"
version = "0.1.0"
description = "Grid load optimisation & renewable curtailment minimisation agent system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langgraph>=0.1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pydantic>=2.5",
    "jinja2>=3.1",
    "reportlab>=4.0",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["data/*.csv", "data/models/*.joblib", "data/models/*.json", "reports/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
